name: verification

on:
  push:
    paths:
      - ".github/workflows/verification.yml"
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate XML resources
        run: python3 scripts/verify_resources.py
      - name: Run JVM tests and assemble debug APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-community-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
