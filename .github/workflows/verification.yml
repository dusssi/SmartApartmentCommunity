name: verification

on:
  push:
    paths:
      - ".github/workflows/verification.yml"
      - "app/**"
      - "backend/**"
      - "scripts/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate XML resources
        run: python3 scripts/verify_resources.py
      - name: Run JVM tests and assemble debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain testDebugUnitTest assembleDebug 2>&1 | tee "$RUNNER_TEMP/android-verification.log"
      - name: Surface Android failure diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path(__import__('os').environ['RUNNER_TEMP']) / 'android-verification.log'
          lines = path.read_text(errors='replace').splitlines() if path.exists() else []
          needles = ('error:', 'FAILURE:', 'What went wrong:', 'Execution failed', 'Caused by:', 'tests completed')
          selected = [line for line in lines if any(word in line for word in needles)][-60:]
          if not selected:
              selected = lines[-60:]
          for line in selected:
              escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::{escaped}')
          summary = Path(__import__('os').environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a') as output:
              output.write('\n### Android verification diagnostics\n\n```text\n')
              output.write('\n'.join(lines[-160:]))
              output.write('\n```\n')
          PY
      - name: Upload Android verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-log
          path: ${{ runner.temp }}/android-verification.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-community-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  backend-h2:
    name: Spring API tests and H2 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run API integration tests with H2
        working-directory: backend
        run: |
          set -o pipefail
          ../gradlew --no-daemon --stacktrace --console=plain test 2>&1 | tee "$RUNNER_TEMP/backend-h2.log"
      - name: Surface H2 failure diagnostics
        if: failure()
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci_diagnostics.py "$RUNNER_TEMP/backend-h2.log"
      - name: Surface H2 JUnit failures
        if: failure()
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci_test_diagnostics.py backend/build/test-results/test
      - name: Surface H2 server errors
        if: failure()
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci_test_diagnostics.py backend/build/test-results/test --server
      - name: Upload H2 test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-h2-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  backend-mysql:
    name: Spring API tests and MySQL 8.4 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: smart_community_test
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run API integration tests with MySQL
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/smart_community_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ""
        run: |
          set -o pipefail
          ../gradlew --no-daemon --stacktrace --console=plain test 2>&1 | tee "$RUNNER_TEMP/backend-mysql.log"
      - name: Surface MySQL failure diagnostics
        if: failure()
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci_diagnostics.py "$RUNNER_TEMP/backend-mysql.log"
      - name: Surface MySQL JUnit failures
        if: failure()
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci_test_diagnostics.py backend/build/test-results/test
      - name: Upload MySQL test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-mysql-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
